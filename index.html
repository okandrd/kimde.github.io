<!doctype html>

    <title>Kimde? — Privacy Policy &amp; Support</title>
    <style>
      :root { --accent: #d9541f; --text: #141310; --muted: #6b665d; --bg: #f4f2ee; --card: #e9e6e0; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: var(--text);
        background: var(--bg);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 640px; margin: 0 auto; padding: 64px 24px; text-align: center; }
      h1 { font-size: 30px; margin: 0 0 4px; }
      .tagline { color: var(--muted); margin: 0 0 40px; }
      h2 { font-size: 15px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); margin: 40px 0 16px; font-weight: 600; }
      .links { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 999px;
        background: var(--card);
        color: var(--text);
        text-decoration: none;
        font-weight: 600;
      }
      a.btn.primary { background: var(--accent); color: #fff; }
      footer { margin-top: 56px; font-size: 13px; color: var(--muted); }
      footer a { color: var(--muted); }
      @media (prefers-color-scheme: dark) {
        :root { --text: #f6f4f0; --muted: #a6a19a; --bg: #0c0c0d; --card: #1c1c1f; --accent: #ff8a50; }
        a.btn.primary { color: #101010; }
      }
    </style>
  </head>
